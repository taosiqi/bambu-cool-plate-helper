name: Verify Windows
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile tests and render preview (no package)
        shell: pwsh
        run: ./windows/build.ps1 -TestOnly
      - uses: actions/upload-artifact@v4
        with:
          name: windows-preview
          path: windows-preview.png
